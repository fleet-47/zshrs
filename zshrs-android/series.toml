# Dependency upgrades retire independently after main supplies the target dependency versions.
# Android compatibility remains separate and is never retired by dependency versions.

[[patch]]
id = "libloading"
group = "upgrades"
file = "upgrades/libloading.patch"
dependency = "libloading"
version = "0.9.0"
manifests = ["Cargo.toml"]

[[patch]]
id = "fancy-regex"
hold = "Keep upstream fancy-regex 0.18 until shell matching parity is demonstrated."
group = "upgrades"
file = "upgrades/fancy-regex.patch"
dependency = "fancy-regex"
version = "0.19.2"
manifests = ["Cargo.toml"]

[[patch]]
id = "nix"
group = "upgrades"
file = "upgrades/nix.patch"
dependency = "nix"
version = "0.31.3"
manifests = ["Cargo.toml", "daemon/Cargo.toml"]

[[patch]]
id = "rusqlite"
hold = "Keep upstream rusqlite 0.32/SQLite: stored-text conversion errors change in dependent daemon and cache functions."
group = "upgrades"
file = "upgrades/rusqlite.patch"
dependency = "rusqlite"
version = "0.40.2"
manifests = ["Cargo.toml", "daemon/Cargo.toml"]

[[patch]]
id = "dirs"
group = "upgrades"
file = "upgrades/dirs.patch"
dependency = "dirs"
version = "7.0.0"
manifests = ["Cargo.toml", "daemon/Cargo.toml"]

[[patch]]
id = "rand"
hold = "Keep upstream rand 0.8: preserve fork recovery and seeded fuzzer replay."
group = "upgrades"
file = "upgrades/rand.patch"
dependency = "rand"
version = "0.10.3"
manifests = ["Cargo.toml", "daemon/Cargo.toml"]

